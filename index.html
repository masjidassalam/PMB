<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Laporan Mubaligh</title>
  
  <!-- PWA Setup -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#047857">
  <link rel="apple-touch-icon" href="./icon-192.png">
  
  <!-- Library -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            emerald: { 50: '#ecfdf5', 600: '#059669', 700: '#047857', 800: '#065f46', 900: '#064e3b' }
          }
        }
      }
    };
  </script>
  <style>
    input, select, textarea { font-size: 16px !important; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-24">

  <!-- HEADER -->
  <header class="bg-emerald-800 text-white px-4 py-3 shadow sticky top-0 z-30 flex items-center justify-between">
    <div class="flex items-center space-x-2.5">
      <div class="w-10 h-10 rounded-lg bg-emerald-600 flex items-center justify-center text-white">
        <i class="ph-bold ph-mosque text-2xl"></i>
      </div>
      <div>
        <h1 class="font-bold text-sm leading-tight">LAPORAN MUBALIGH</h1>
        <p class="text-[10px] text-emerald-200">Kecamatan Sagulung, Batam</p>
      </div>
    </div>
  </header>

  <!-- KONTEN UTAMA -->
  <main class="max-w-xl mx-auto p-3.5 sm:p-4 space-y-3.5">
    
    <!-- TAB 1: INPUT -->
    <section id="tab-input" class="space-y-3 block">
      <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div class="flex items-center gap-2 text-xs font-bold text-slate-700">
          <i class="ph-bold ph-users text-emerald-700 text-xl"></i>
          <span class="uppercase tracking-wider">Status Anda:</span>
        </div>
        <span class="bg-emerald-100 text-emerald-800 border border-emerald-300 px-3 py-1 rounded-lg text-xs font-bold">Mubaligh Aktif</span>
      </div>

      <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
        <div class="flex items-center justify-between border-b pb-2">
          <span class="text-xs font-bold uppercase tracking-wider text-emerald-800 flex items-center gap-1.5">
            <i class="ph-bold ph-pencil-simple-line text-base"></i> Catat Kegiatan Baru
          </span>
          <span id="badgeHariIni" class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-emerald-50 text-emerald-800 border border-emerald-200">
            Memuat...
          </span>
        </div>

        <form id="formKegiatan" onsubmit="handleFormSubmit(event)" class="space-y-3 text-xs">
          <div>
            <label class="block font-semibold text-slate-600 mb-1">Tanggal Kegiatan</label>
            <input type="date" id="tanggal" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-700 focus:outline-none focus:border-emerald-600">
          </div>
          <div>
            <label class="block font-semibold text-slate-600 mb-1">Uraian Kegiatan</label>
            <textarea id="kegiatan" rows="3" placeholder="Contoh: Mengisi kajian / Memimpin yasinan..." required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-emerald-600"></textarea>
          </div>
          <div>
            <label class="block font-semibold text-slate-600 mb-1">Keterangan Tambahan <span class="text-slate-400 font-normal">(Opsional)</span></label>
            <input type="text" id="keterangan" placeholder="Contoh: Hadir 50 jamaah" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-emerald-600">
          </div>
          <button type="submit" id="btnSimpan" class="w-full py-3 bg-emerald-700 hover:bg-emerald-800 text-white font-bold rounded-xl shadow flex items-center justify-center gap-1.5 transition-all mt-2">
            <i class="ph-bold ph-floppy-disk text-base"></i> Simpan Kegiatan
          </button>
        </form>
      </div>
    </section>

    <!-- TAB 2: REKAP -->
    <section id="tab-rekap" class="space-y-3 hidden">
      <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
        <div class="border-b pb-2">
          <span class="text-xs font-bold uppercase tracking-wider text-emerald-800 flex items-center gap-1.5">
            <i class="ph-bold ph-file-text text-base"></i> Rekap & Cetak Laporan
          </span>
        </div>
        <div class="text-xs">
          <label class="block font-semibold text-slate-600 mb-1">Pilih Bulan Laporan</label>
          <select id="filterBulan" onchange="filterTabelData()" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-800 focus:outline-none focus:border-emerald-600">
            <!-- Opsi JS -->
          </select>
        </div>
        <button type="button" id="btnPDF" onclick="cetakPDF()" class="w-full py-3 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl shadow flex items-center justify-center gap-1.5 transition-all mt-1">
          <i class="ph-bold ph-printer text-base text-amber-400"></i> Download PDF
        </button>
      </div>

      <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
        <div class="flex items-center justify-between border-b pb-2">
          <span class="text-xs font-bold uppercase tracking-wider text-slate-700 flex items-center gap-1.5">
            <i class="ph-bold ph-list-numbers text-emerald-700 text-base"></i> Daftar Kegiatan
          </span>
        </div>
        <div id="cardContainer" class="space-y-2 max-h-[60vh] overflow-y-auto divide-y divide-slate-100 pr-1 text-xs">
          <!-- Data Kegiatan -->
        </div>
      </div>
    </section>
  </main>

  <!-- BOTTOM NAV -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-1.5 py-1.5 flex justify-around items-center z-40 shadow-lg max-w-xl mx-auto">
    <button type="button" onclick="switchTab('input', this)" id="nav-input" class="flex flex-col items-center text-emerald-700 font-bold flex-1">
      <i class="ph-bold ph-pencil-simple text-xl"></i>
      <span class="text-[10px] mt-0.5">Input</span>
    </button>
    <button type="button" onclick="switchTab('rekap', this)" id="nav-rekap" class="flex flex-col items-center text-slate-400 font-medium flex-1">
      <i class="ph-bold ph-file-text text-xl"></i>
      <span class="text-[10px] mt-0.5">Rekap & Cetak</span>
    </button>
  </nav>

  <script>
    let globalData = null;

    // --- INISIALISASI PWA ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(registration => console.log('ServiceWorker registered:', registration.scope))
          .catch(err => console.log('ServiceWorker registration failed:', err));
      });
    }
    // ------------------------

    window.onload = function() {
      const today = new Date();
      document.getElementById('tanggal').valueAsDate = today;
      
      const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
      document.getElementById('badgeHariIni').innerText = days[today.getDay()] + ' (Otomatis)';

      loadData();
    };

    window.switchTab = function(tabName, element) {
      document.getElementById('tab-input').classList.add('hidden');
      document.getElementById('tab-rekap').classList.add('hidden');
      
      document.getElementById('nav-input').className = "flex flex-col items-center text-slate-400 font-medium flex-1";
      document.getElementById('nav-rekap').className = "flex flex-col items-center text-slate-400 font-medium flex-1";

      document.getElementById('tab-' + tabName).classList.remove('hidden');
      element.className = "flex flex-col items-center text-emerald-700 font-bold flex-1";
      
      if (tabName === 'rekap') filterTabelData();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    function loadData() {
      google.script.run.withSuccessHandler(function(res) {
        globalData = res;
        var selectBulan = document.getElementById("filterBulan");
        selectBulan.innerHTML = "";
        
        if (!res.daftarBulan || res.daftarBulan.length === 0) {
          selectBulan.innerHTML = '<option value="">Belum ada data</option>';
        } else {
          res.daftarBulan.forEach(function(item) {
            var opt = document.createElement("option");
            opt.value = item.key;
            opt.textContent = item.label;
            selectBulan.appendChild(opt);
          });
        }
        filterTabelData();
      }).withFailureHandler(function(err) {
        Swal.fire('Error', 'Gagal memuat data: ' + err.message, 'error');
      }).getDataLaporan();
    }

    function filterTabelData() {
      if (!globalData) return;
      var selectedBulan = document.getElementById("filterBulan").value;
      var container = document.getElementById("cardContainer");
      container.innerHTML = "";

      var filtered = globalData.semuaKegiatan ? globalData.semuaKegiatan.filter(function(item) {
        return !selectedBulan || item.bulanKey === selectedBulan;
      }) : [];

      if (filtered.length === 0) {
        container.innerHTML = '<div class="py-6 text-center text-slate-400 italic text-xs">Tidak ada kegiatan pada bulan ini.</div>';
        return;
      }

      filtered.forEach(function(item, index) {
        var card = document.createElement("div");
        card.className = "pt-2 pb-2 flex justify-between items-start gap-3";
        card.innerHTML = `
          <div class="flex-1">
            <span class="font-bold text-slate-800 text-sm block leading-tight mb-1">${item.kegiatan}</span>
            <span class="text-[10px] text-slate-400">#${index + 1} • ${item.tanggal}</span>
            ${item.keterangan ? `<div class="text-[11px] text-slate-600 mt-1 border-t border-slate-100 pt-1"><b>Ket:</b> ${item.keterangan}</div>` : ''}
          </div>
          <span class="bg-emerald-50 text-emerald-800 border border-emerald-200 px-2 py-0.5 rounded text-[10px] font-bold whitespace-nowrap">${item.bulanLabel || 'Kegiatan'}</span>
        `;
        container.appendChild(card);
      });
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      var btnSubmit = document.getElementById("btnSimpan");
      btnSubmit.disabled = true;
      btnSubmit.innerHTML = '<i class="ph-bold ph-spinner animate-spin text-base"></i> Menyimpan...';

      var data = {
        tanggal: document.getElementById("tanggal").value,
        kegiatan: document.getElementById("kegiatan").value,
        keterangan: document.getElementById("keterangan").value
      };

      google.script.run.withSuccessHandler(function(msg) {
        Swal.fire({ title: 'Berhasil!', text: msg || 'Kegiatan disimpan.', icon: 'success', timer: 1500, showConfirmButton: false });
        document.getElementById("formKegiatan").reset();
        document.getElementById('tanggal').valueAsDate = new Date();
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = '<i class="ph-bold ph-floppy-disk text-base"></i> Simpan Kegiatan';
        loadData();
      }).withFailureHandler(function(err) {
        Swal.fire('Gagal', 'Terjadi kesalahan sistem.', 'error');
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = '<i class="ph-bold ph-floppy-disk text-base"></i> Simpan Kegiatan';
      }).simpanData(data);
    }

    function cetakPDF() {
      var bulanPilihan = document.getElementById("filterBulan").value;
      var btn = document.getElementById('btnPDF');
      btn.innerHTML = '<i class="ph-bold ph-spinner animate-spin text-base"></i> Menyiapkan...';
      btn.disabled = true;

      google.script.run.withSuccessHandler(function(base64) {
        var byteCharacters = atob(base64);
        var byteNumbers = new Array(byteCharacters.length);
        for (let i = 0; i < byteCharacters.length; i++) {
          byteNumbers[i] = byteCharacters.charCodeAt(i);
        }
        var blob = new Blob([new Uint8Array(byteNumbers)], {type: 'application/pdf'});
        var blobUrl = URL.createObjectURL(blob);
        
        var a = document.createElement("a");
        a.href = blobUrl;
        a.download = "Laporan_Mubaligh.pdf";
        a.click();

        btn.innerHTML = '<i class="ph-bold ph-printer text-base text-amber-400"></i> Download PDF';
        btn.disabled = false;
        Swal.fire({ title: 'PDF Siap', text: 'File PDF berhasil diunduh.', icon: 'success', timer: 2000, showConfirmButton: false });
      }).withFailureHandler(function(err) {
        btn.innerHTML = '<i class="ph-bold ph-printer text-base text-amber-400"></i> Download PDF';
        btn.disabled = false;
        Swal.fire('Gagal', 'Gagal membuat PDF.', 'error');
      }).generatePDF(bulanPilihan);
    }
  </script>
</body>
</html>
